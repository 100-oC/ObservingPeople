<!DOCTYPE html>
<html>
    <head>
        <!--ページの説明部分-->
        <!--タブに表示されるタイトルとかの設定-->
        <meta charset="UTF-8">
        <title>人間観察くん</title>

        <!--TODO:ここで他ファイルを読み込む-->
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header>
            <h1>　人間観察くん
                <small><small><small><small>Ver. 0.1.3</small></small></small></small>
            </h1><hr>
        </header>
        
        <main id="MainContent">
            <!--ホーム-->
            <section id="Home" class="Page Active">
                <div class="ItemContainer">
                    <!--キャラリスト-->
                    <div class ="ItemBlock HomeCharaList">
                        <h3>キャラリスト</h3><hr>
                        <div class="ScrollArea">
                            <ul class="CharaListViewer">キャラを登録してください</ul>
                        </div>
                    </div>
<!--                
                    <div class ="ItemBlock HomeCharaList">
                        <h3>キャラ詳細</h3><hr>
                        <p>キャラ名</p>
                    </div>
-->
                </div>              
<!--
                <div class ="TimeKeeperBlock">
                    <hr>
                    ⏸️▶️⏩
                    <hr>
                </div>
-->
                <!--行動ログ-->
                <div class ="ItemBlock BottomLongBlock LogBlock">
                    <h3>行動ログ</h3><hr>
                    <div class="ScrollArea">
                        <ul id="ActionLogViewer"></ul>
                    </div>
                </div>
            </section>

            <section id="CharaSetting" class="Page">
                <div class ="ItemBlock">
                    <big>キャラリスト</big>
                </div>
                
                <div class ="ItemBlock BottomLongBlock">
                    <ul class="CharaListViewer">キャラを登録してください</ul>
                </div>
                
                <!--TODO:キャラ追加は前面に薄黒で専用画面を表示する-->
                <div class ="ItemBlock">
                    <input type="text" id="AddCharaName">
                    <button id="AddCharaButton">キャラを追加する</button>
                </div>
            </section>
        </main>
        
        <!--ページ切り替えタブ-->
        <nav class="BottomNav">
            <button class="NavItem" data-page="CharaSetting">
                <span class="NavIcon">Ω</span>
                <span>キャラ管理</span>
            </button>
            <button class="NavItem Active" data-page="Home">
                <span class="NavIcon">⌂<br></span>
                <span>ホーム</span>
            </button>
        </nav>
        
        <script type="module" src="src/main.js"></script>
    </body>
</html>
